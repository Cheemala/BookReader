[versions]
agp = "8.13.0"
hiltAndroid = "2.57.1"
hiltNavCompose = "1.2.0"
kotlin = "2.2.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.3"
activityCompose = "1.10.1"
composeBom = "2025.08.01"
navVersion = "2.9.3"
retrofitVersion = "3.0.0"
gsonConVersion = "3.0.0"
okHttpVersion = "5.1.0"
coilComposeVersion = "3.3.0"
coilNetworkOkhttpVersion = "3.3.0"
roomDbVersion = "2.7.2"
kotlinCoroutineVersion = "1.10.2"
coroutineSupportForVMVersion = "2.9.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref="navVersion"}
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroid" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-navigation-compose = {module = "androidx.hilt:hilt-navigation-compose",  version.ref = "hiltNavCompose"}
retrofit-android = {module = "com.squareup.retrofit2:retrofit", version.ref = "retrofitVersion"}
gson-converter = {module = "com.squareup.retrofit2:converter-gson", version.ref = "gsonConVersion"}
ok-http = {module = "com.squareup.okhttp3:okhttp", version.ref = "okHttpVersion"}
coil-compose = {module = "io.coil-kt.coil3:coil-compose", version.ref = "coilComposeVersion"}
coil-network-okhttp = {module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coilNetworkOkhttpVersion"}
room-database = {module = "androidx.room:room-runtime", version.ref = "roomDbVersion"}
room-compiler = {module ="androidx.room:room-compiler", version.ref = "roomDbVersion"}
kotlin-coroutine = {module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref= "kotlinCoroutineVersion"}
room-coroutine-support = {module = "androidx.room:room-ktx", version.ref="roomDbVersion"}
coroutine-viewmodel-support = {module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "coroutineSupportForVMVersion"}
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hiltPlugin = {id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid"}
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }